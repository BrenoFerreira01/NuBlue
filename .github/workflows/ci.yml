name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Mesmas credenciais e portas do .env.development (infra/compose.yaml).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: local_user
          POSTGRES_PASSWORD: local_password
          POSTGRES_DB: local_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U local_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run lint:check

      - name: Apply migrations twice (the second run must be a no-op) and seed
        run: |
          npm run migrations:up
          npm run migrations:up
          npm run dev:seed

      - name: Build
        run: npm run build

      # Os testes de integração falam com o servidor rodando, como no `npm test` local.
      - name: Run tests
        run: |
          npx next dev > next.log 2>&1 &
          npx jest --runInBand
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Server log
        if: failure()
        run: cat next.log

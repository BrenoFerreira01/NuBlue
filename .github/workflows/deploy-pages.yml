name: Deploy frontend to GitHub Pages

# Publishes the React/Vite frontend. The API is hosted elsewhere; its URL comes from
# the repository variable VITE_API_URL (Settings > Secrets and variables > Actions >
# Variables). See DEPLOY.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Warn when the API URL is missing
        if: ${{ vars.VITE_API_URL == '' }}
        run: echo "::warning title=VITE_API_URL not set::The site will be published in visitor mode only (no login, progress or ranking). Set the repository variable VITE_API_URL to the API's HTTPS URL."

      - name: Build application
        env:
          # /NuBlue/ for https://<user>.github.io/NuBlue/; empty with a custom domain.
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
